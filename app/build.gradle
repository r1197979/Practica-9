 */

plugins {
    id 'application'
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // Dependencias de producción (si las hubiera)
    // implementation 'com.google.guava:guava:32.1.3-jre'

    // Dependencias de test
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'practica9.Main'
}

// Configuración moderna de Gradle para declarar el framework de pruebas
testing {
    suites {
        test {
            useJUnitJupiter() // Declara explícitamente JUnit 5
        }
    }
}

// Configuración adicional para todos los tests
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
